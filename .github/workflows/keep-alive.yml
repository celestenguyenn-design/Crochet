# Supabase pauses free projects after ~7 days without activity.
# This makes a tiny read request twice a week so the shop never goes to sleep.
name: Keep database awake
on:
  schedule:
    - cron: "17 15 * * 1,4"   # Mondays & Thursdays
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vujfyzsbuagarlhtyebs.supabase.co/rest/v1/settings?select=shop_name&id=eq.1" \
            -H "apikey: sb_publishable_9tjaNtaNfIcESjOgGWHu8g_75dS1L4R")
          echo "Status: $code"
          test "$code" = "200"
