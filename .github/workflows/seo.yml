# Keeps link previews (Messenger, Facebook, iMessage, Pinterest…) and the Google sitemap up to date.
name: Update link previews & sitemap
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-seo.mjs
      - name: Save changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update link previews & sitemap"
          git push
          # ask GitHub Pages to publish the new files
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
