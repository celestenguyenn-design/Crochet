<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .bob { animation: bob 2.4s ease-in-out infinite; transform-origin: 64px 76px; }
    .swayL { animation: swayL 2.4s ease-in-out infinite; transform-origin: 24px 112px; }
    .swayR { animation: swayR 2.4s ease-in-out infinite; transform-origin: 106px 112px; }
    .tw1 { animation: tw 1.6s ease-in-out infinite; transform-origin: 104px 22px; }
    .tw2 { animation: tw 1.6s ease-in-out .8s infinite; transform-origin: 20px 34px; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
    @keyframes swayL { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } }
    @keyframes swayR { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-5deg); } }
    @keyframes tw { 0%,100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }
  </style>
  <!-- soft round badge -->
  <circle cx="64" cy="64" r="62" fill="#ffe8f1"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="#f6c6da" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- tulip (left) -->
  <g class="swayL">
    <path d="M24 112 C24 96 24 86 25 76" stroke="#7fb77e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M24 100 C15 96 13 88 15 84 C21 88 24 93 24 100Z" fill="#9fd19a"/>
    <path d="M17 66 C16 74 20 80 25 80 C30 80 34 74 33 66 L29 71 L25 63 L21 71Z" fill="#c8a8f0" stroke="#a585d6" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- daisy (right) -->
  <g class="swayR">
    <path d="M106 112 C106 98 105 90 104 84" stroke="#7fb77e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M105 102 C114 98 116 91 114 87 C108 90 105 95 105 102Z" fill="#9fd19a"/>
    <g transform="translate(104 76)">
      <g fill="#ffffff" stroke="#f2c6d6" stroke-width="1.2">
        <ellipse cx="0" cy="-9" rx="4.2" ry="7"/><ellipse cx="0" cy="9" rx="4.2" ry="7"/>
        <ellipse cx="-9" cy="0" rx="7" ry="4.2"/><ellipse cx="9" cy="0" rx="7" ry="4.2"/>
        <ellipse cx="-6.4" cy="-6.4" rx="4" ry="6.5" transform="rotate(-45 -6.4 -6.4)"/><ellipse cx="6.4" cy="6.4" rx="4" ry="6.5" transform="rotate(-45 6.4 6.4)"/>
        <ellipse cx="6.4" cy="-6.4" rx="4" ry="6.5" transform="rotate(45 6.4 -6.4)"/><ellipse cx="-6.4" cy="6.4" rx="4" ry="6.5" transform="rotate(45 -6.4 6.4)"/>
      </g>
      <circle r="5.2" fill="#ffd36e" stroke="#f0b440" stroke-width="1.2"/>
    </g>
  </g>
  <!-- yarn ball + hook (bobbing) -->
  <g class="bob">
    <!-- yarn tail -->
    <path d="M82 92 C92 100 88 110 78 110 C68 110 64 116 70 121" stroke="#ef8fb4" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- crochet hook tucked behind the ball -->
    <g transform="rotate(32 64 70)">
      <rect x="61" y="14" width="6" height="60" rx="3" fill="#c39be8" stroke="#9e74cf" stroke-width="1.5"/>
      <path d="M61 16 C61 10 67 9 67 14 L64.5 15" fill="none" stroke="#9e74cf" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <circle cx="64" cy="72" r="27" fill="#f7a8c8" stroke="#e27aa8" stroke-width="3"/>
    <!-- wrapped strands -->
    <g stroke="#e27aa8" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85">
      <path d="M42 62 C54 55 74 55 87 65"/>
      <path d="M38 74 C52 67 76 67 90 77"/>
      <path d="M44 87 C56 80 74 80 85 88"/>
      <path d="M54 47 C48 60 48 82 56 98"/>
      <path d="M70 46 C64 60 64 84 72 99"/>
    </g>
    <!-- shine -->
    <path d="M49 56 C53 51 57 49 61 49" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/>
    <!-- cute face -->
    <circle cx="56" cy="76" r="2.6" fill="#5b3a4a"/><circle cx="72" cy="76" r="2.6" fill="#5b3a4a"/>
    <path d="M60.5 81.5 Q64 85 67.5 81.5" stroke="#5b3a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="51.5" cy="82" rx="4" ry="2.4" fill="#ff7fa8" opacity=".55"/><ellipse cx="76.5" cy="82" rx="4" ry="2.4" fill="#ff7fa8" opacity=".55"/>
  </g>
  <!-- sparkles -->
  <path class="tw1" d="M104 12 L106.5 19.5 L114 22 L106.5 24.5 L104 32 L101.5 24.5 L94 22 L101.5 19.5Z" fill="#ffd36e"/>
  <path class="tw2" d="M20 26 L21.8 31.2 L27 33 L21.8 34.8 L20 40 L18.2 34.8 L13 33 L18.2 31.2Z" fill="#c8a8f0"/>
</svg>
