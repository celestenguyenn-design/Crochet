<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Orders</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="container article">
  <h1>Request a custom piece</h1>
  <p class="muted">Tell me what you have in mind and I'll get back to you with a quote.</p>
  <form id="form" class="card">
    <div class="row">
      <div><label>Your name *</label><input name="name" required maxlength="200"></div>
      <div><label>Email *</label><input name="email" type="email" required maxlength="200"></div>
    </div>
    <label>Phone</label><input name="phone" type="tel" maxlength="50">
    <label>What would you like made? *</label><textarea name="description" required maxlength="5000" placeholder="e.g. A frog amigurumi holding a strawberry, about 8 inches tall"></textarea>
    <div class="row">
      <div><label>Colors</label><input name="colors" maxlength="500"></div>
      <div><label>Size</label><input name="size" maxlength="500"></div>
    </div>
    <div class="row">
      <div><label>Budget</label><input name="budget" maxlength="200"></div>
      <div><label>Needed by</label><input name="needed_by" type="date"></div>
    </div>
    <p class="error" id="err"></p>
    <button class="btn" id="submit">Send request</button>
  </form>
  <div id="done" class="notice" style="display:none"><h2>Request sent! 💌</h2><p>Thanks! I'll email you soon with a quote.</p></div>
</main>
<script type="module">
import { sb, getSettings, renderChrome } from "./assets/common.js";
renderChrome(await getSettings(), "custom");
const item = new URLSearchParams(location.search).get("item");
if (item) {
  const d = document.querySelector("[name=description]");
  d.value = `I'd like a custom version of "${item.slice(0, 120)}":\n- Size: \n- Anything else: `;
  document.querySelector("[name=size]").placeholder = "e.g. twice as big";
}
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (!f.needed_by) f.needed_by = null;
  const btn = document.getElementById("submit"); btn.disabled = true;
  const { error } = await sb.from("custom_requests").insert(f);
  if (error) { document.getElementById("err").textContent = error.message; btn.disabled = false; return; }
  e.target.style.display = "none"; document.getElementById("done").style.display = "";
});
</script>
<footer id="site-footer"></footer>
</body>
</html>
