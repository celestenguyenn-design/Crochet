<header id="site-header"></header>
<main class="container article"><h1>📍 Find me at markets</h1>
<p class="muted">Come say hi in person! Pre-orders can be picked up at any of these.</p>
<div id="events" class="events" style="grid-template-columns:1fr"><p class="muted">Loading…</p></div>
<div class="notice center" style="margin-top:28px"><p>Can't make it? Shop online or request something custom.</p><a class="btn" href="shop.html">Shop now</a> <a class="btn secondary" href="custom.html">Custom orders</a></div></main>
<script type="module">
import { sb, getSettings, renderChrome } from "./assets/common.js?v=20261127194427";
import { eventCard } from "./assets/sections.js?v=20261127194427";
renderChrome(await getSettings(), "markets");
const today = new Date().toISOString().slice(0, 10);
const { data } = await sb.from("events").select("*").or(`ends_on.gte.${today},and(ends_on.is.null,starts_on.gte.${today})`).order("starts_on");
document.getElementById("events").innerHTML = data?.length ? data.map(eventCard).join("") : `<div class="card center"><p>No markets scheduled right now — follow me on Instagram for the next one! 💕</p></div>`;
</script>
<footer id="site-footer"></footer>
