<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="container">
  <section id="hero" class="hero"><h1>&nbsp;</h1></section>
  <section id="bestsellers" style="display:none; margin-bottom:48px">
    <h2 id="bestsellers-title" class="section-title"></h2>
    <div id="featured" class="grid"></div>
  </section>
  <section id="gallery-section" style="display:none; margin-bottom:48px">
    <h2 id="gallery-title" class="section-title"></h2>
    <div id="gallery" class="gallery"></div>
  </section>
  <h2 id="shop" class="section-title">Shop All</h2>
  <div id="products" class="grid"><p class="muted">Loading…</p></div>
  <dialog id="lightbox" class="lightbox"></dialog>
  <section id="about" class="card" style="margin-top:48px; display:none"></section>
</main>
<script type="module">
import { sb, getSettings, renderChrome, esc, money, safeUrl, cart, toast } from "./assets/common.js";
const s = await getSettings();
renderChrome(s, "shop");

const hero = document.getElementById("hero");
if (safeUrl(s.hero_image_url)) {
  hero.classList.add("has-img");
  hero.style.backgroundImage = `linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)), url("${encodeURI(s.hero_image_url)}")`;
}
hero.innerHTML = `<h1>${esc(s.hero_title)}</h1><p>${esc(s.hero_subtitle)}</p>
  <a class="btn" href="#shop">Shop now</a> <a class="btn secondary" href="custom.html">Request a custom piece</a>
  <svg class="wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0,20 C150,45 300,0 450,20 C600,40 750,0 900,20 C1050,40 1150,10 1200,20 L1200,40 L0,40 Z"/></svg>`;

if (s.about_text) {
  const a = document.getElementById("about");
  a.style.display = "";
  a.innerHTML = `<h2>About me</h2><p style="white-space:pre-wrap">${esc(s.about_text)}</p>`;
}

const [{ data: products, error }, { data: photos }] = await Promise.all([
  sb.from("products").select("*").order("sort_order").order("created_at", { ascending: false }),
  sb.from("gallery").select("*").order("sort_order").order("created_at", { ascending: false }),
]);

function productCard(p) {
  const soldOut = p.stock === 0;
  const img = safeUrl(p.image_url) ? `<img class="img" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="img"></div>`;
  const stock = p.stock === null ? "Made to order" : soldOut ? "Sold out" : `${p.stock} available`;
  return `<div class="product">${p.featured ? `<span class="ribbon">★ Best seller</span>` : ""}${img}<div class="body">
    <h3>${esc(p.name)}</h3><div class="price">${money(p.price_cents)}</div>
    <div class="desc">${esc(p.description)}</div><div class="stock">${stock}</div>
    <button class="btn" data-id="${p.id}" ${soldOut ? "disabled" : ""}>${soldOut ? "Sold out" : "Add to cart"}</button>
  </div></div>`;
}
function onAdd(e) {
  const id = e.target.dataset?.id; if (!id) return;
  const p = products.find((x) => x.id === id);
  const inCart = cart.get().find((i) => i.product_id === id)?.quantity || 0;
  if (p.stock !== null && inCart >= p.stock) return toast(`Only ${p.stock} available`);
  cart.add(p); toast(`Added ${p.name} to cart`);
}

const box = document.getElementById("products");
if (error) box.innerHTML = `<p class="error">Couldn't load products.</p>`;
else if (!products.length) box.innerHTML = `<p class="muted">New items coming soon!</p>`;
else {
  box.innerHTML = products.map(productCard).join("");
  box.addEventListener("click", onAdd);
  const featured = products.filter((p) => p.featured);
  if (featured.length) {
    document.getElementById("bestsellers").style.display = "";
    document.getElementById("bestsellers-title").textContent = s.bestsellers_title || "Best Sellers";
    const f = document.getElementById("featured");
    f.innerHTML = featured.map(productCard).join("");
    f.addEventListener("click", onAdd);
  }
}

if (photos?.length) {
  document.getElementById("gallery-section").style.display = "";
  document.getElementById("gallery-title").textContent = s.gallery_title || "Recent Makes";
  const g = document.getElementById("gallery");
  g.innerHTML = photos.filter((ph) => safeUrl(ph.image_url)).map((ph, i) => `<figure data-i="${i}">
    <img src="${esc(ph.image_url)}" alt="${esc(ph.caption || "Crochet photo")}" loading="lazy">
    ${ph.caption ? `<figcaption>${esc(ph.caption)}</figcaption>` : ""}</figure>`).join("");
  const lb = document.getElementById("lightbox");
  g.addEventListener("click", (e) => {
    const fig = e.target.closest("figure"); if (!fig) return;
    const ph = photos[fig.dataset.i];
    lb.innerHTML = `<img src="${esc(ph.image_url)}" alt="">${ph.caption ? `<p>${esc(ph.caption)}</p>` : ""}<button class="btn small" autofocus>Close</button>`;
    lb.querySelector("button").onclick = () => lb.close();
    lb.showModal();
  });
  lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });
}
</script>
<footer id="site-footer"></footer>
</body>
</html>
