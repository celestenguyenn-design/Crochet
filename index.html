<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon/apple-touch.png">
<link rel="stylesheet" href="assets/style.css?v=20261127194630">
<!--og-->
<meta name="description" content="Handmade crochet plushies, pipe cleaner flower bouquets &amp; polymer clay. Custom orders welcome!">

<meta name="twitter:description" content="Handmade crochet plushies, pipe cleaner flower bouquets &amp; polymer clay. Custom orders welcome!">

<!--/og-->
</head>
<body>
<header id="site-header"></header>
<main class="container" id="home"><p class="muted center">Loading…</p></main>
<dialog id="lightbox" class="lightbox"></dialog>
<footer id="site-footer"></footer>
<script type="module">
import { sb, getSettings, renderChrome, applyTheme, esc, cart, toast, wireSignup, startCountdowns } from "./assets/common.js?v=20261127194630";
import { renderSections, newSection, wireCarousels, loadInstagram, wireAutoplay } from "./assets/sections.js?v=20261127194630";

const preview = new URLSearchParams(location.search).has("preview");
let s = await getSettings();
renderChrome(s, "shop");

const q = (t, sel = "*") => sb.from(t).select(sel);
const today = new Date().toISOString().slice(0, 10);
const [products, categories, gallery, reviews, faqs, patterns, events] = await Promise.all([
  q("products").eq("active", true).order("sort_order").order("created_at", { ascending: false }),
  q("categories").order("sort_order").order("name"),
  q("gallery").order("sort_order").order("created_at", { ascending: false }),
  q("reviews").eq("visible", true).order("sort_order").order("created_at", { ascending: false }),
  q("faqs").order("sort_order"),
  q("patterns", "slug,title,summary,cover_image_url,difficulty,published_at").eq("published", true).order("published_at", { ascending: false }).limit(12),
  q("events").or(`ends_on.gte.${today},and(ends_on.is.null,starts_on.gte.${today})`).order("starts_on").limit(20),
]).then((rs) => rs.map((r) => r.data || []));
// A pre-order that's fully claimed (no spots left) disappears from the homepage completely.
const data = { products: products.filter((p) => !(p.preorder && p.stock === 0)), categories, gallery, reviews, faqs, patterns, events, settings: s, preview };

// Older setups without saved sections get a sensible default layout.
const fallback = () => ["hero", "products", "gallery", "shop", "testimonials", "faq"].map(newSection);

const home = document.getElementById("home");
function render(sections) {
  home.innerHTML = renderSections(sections?.length ? sections : fallback(), data) || `<p class="muted center">Nothing here yet.</p>`;
  wireCarousels(home); startCountdowns(home); loadInstagram(home); reveal(); pauseOffscreen(); wireAutoplay(home);
  const cat = new URLSearchParams(location.search).get("cat");
  if (cat) filterCat(cat);
}
// Only run the sliding photo row while it's on screen (saves the computer's effort).
function pauseOffscreen() {
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle("paused", !e.isIntersecting)));
  home.querySelectorAll(".gallery-strip").forEach((el) => io.observe(el));
}
// Sections gently float up into view as you scroll.
function reveal() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
  home.querySelectorAll(".home-section").forEach((el, i) => { if (i > 1) { el.classList.add("reveal"); io.observe(el); } });
}
function filterCat(id) {
  home.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c.dataset.cat === id));
  home.querySelectorAll("[data-cat-item]").forEach((el) => (el.style.display = !id || el.dataset.catItem === id ? "" : "none"));
}
render(s.home_sections);
wireSignup(home);

home.addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]");
  if (add) {
    const p = products.find((x) => x.id === add.dataset.add);
    if (p.stock !== null && cart.countOf(p.id) >= p.stock) return toast(`Only ${p.stock} available`);
    cart.add(p); return toast(`Added ${p.name} to cart`);
  }
  const chip = e.target.closest(".chip");
  if (chip) return filterCat(chip.dataset.cat);
  const fig = e.target.closest("figure[data-full]");
  if (fig) {
    const lb = document.getElementById("lightbox");
    lb.innerHTML = `<img src="${esc(fig.dataset.full)}" alt="">${fig.dataset.caption ? `<p>${esc(fig.dataset.caption)}</p>` : ""}<button class="btn small" autofocus>Close</button>`;
    lb.querySelector("button").onclick = () => lb.close();
    lb.showModal();
  }
});
document.getElementById("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") e.target.close(); });

// Live preview from the admin Homepage editor
if (preview) {
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.data?.type !== "preview") return;
    s = { ...s, ...e.data.settings }; data.settings = s;
    applyTheme(s); renderChrome(s, "shop", []);
    render(e.data.sections);
    if (e.data.scrollTo) document.querySelector(`[data-section="${e.data.scrollTo}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  parent.postMessage({ type: "preview-ready" }, location.origin);
}
</script>
</body>
</html>
