<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon/apple-touch.png">
<link rel="stylesheet" href="assets/style.css?v=20261127075508">
</head>
<body>
<header id="site-header"></header>
<main class="container" id="cat-page"><p class="muted">Loading…</p></main>
<footer id="site-footer"></footer>
<script type="module">
import { sb, getSettings, renderChrome, esc, safeUrl, cart, toast, startCountdowns } from "./assets/common.js?v=20261127075508";
import { productCard, wireCarousels, md } from "./assets/sections.js?v=20261127075508";
const s = await getSettings();
const slug = new URLSearchParams(location.search).get("c");
const { data: c } = await sb.from("categories").select("*").eq("slug", slug).maybeSingle();
const el = document.getElementById("cat-page");
if (!c) { el.innerHTML = `<h1>Not found</h1><p><a href="index.html">← Back to the shop</a></p>`; renderChrome(s, "shop"); }
else {
  document.title = c.name; renderChrome(s, "cat-" + c.slug);
  const { data: products } = await sb.from("products").select("*").eq("category_id", c.id).eq("active", true).order("sort_order").order("created_at", { ascending: false });
  const isFlowers = /flower|bouquet/i.test(c.name);
  el.innerHTML = `<section class="cat-hero ${safeUrl(c.image_url) ? "has-img" : ""}">
      ${safeUrl(c.image_url) ? `<img src="${esc(c.image_url)}" alt="">` : ""}
      <div><h1>${c.emoji ? esc(c.emoji) + " " : ""}${esc(c.name)}</h1>${c.description ? `<p>${esc(c.description)}</p>` : ""}
      ${/sticker/i.test(c.name) ? "" : /pattern/i.test(c.name) ? `<a class="btn secondary small" href="custom.html?kind=Crochet">Request a custom crochet</a>`
        : `<a class="btn secondary small" href="custom.html?kind=${encodeURIComponent(c.name)}">Request a custom ${esc(c.name.toLowerCase())} piece</a>`}</div>
    </section>
    ${isFlowers ? `<div class="notice combo"><b>💐 + 🧶 Want a crochet friend in your bouquet?</b><br>I can tuck a little crochet piece into any bouquet.
      <a href="custom.html?kind=${encodeURIComponent("Bouquet with a crochet piece")}">Request a bouquet combo →</a></div>` : ""}
    <div class="grid" id="grid" style="margin-top:28px">${(products || []).length ? products.map(productCard).join("")
      : `<div class="card center" style="grid-column:1/-1"><p>New ${esc(c.name.toLowerCase())} pieces are coming soon! 💕</p>
         <a class="btn" href="custom.html?kind=${encodeURIComponent(c.name)}">Request one now</a></div>`}</div>`;
  wireCarousels(el); startCountdowns(el);
  el.addEventListener("click", (e) => {
    const add = e.target.closest("[data-add]"); if (!add) return;
    const p = products.find((x) => x.id === add.dataset.add);
    if (p.stock !== null && cart.countOf(p.id) >= p.stock) return toast(`Only ${p.stock} available`);
    cart.add(p); toast(`Added ${p.name} to cart`);
  });
}
</script>
</body>
</html>
