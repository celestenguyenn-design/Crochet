<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="assets/icon/mascot.svg" type="image/svg+xml">
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon/apple-touch.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="container"><div id="product"><p class="muted">Loading…</p></div></main>
<script type="module">
import { sb, getSettings, renderChrome, esc, money, safeUrl, cart, toast, isLocked, dropLabel, startCountdowns } from "./assets/common.js";
import { md } from "./assets/sections.js";
const s = await getSettings();
const id = new URLSearchParams(location.search).get("id");
const { data: p } = id ? await sb.from("products").select("*, categories(name)").eq("id", id).maybeSingle() : { data: null };
const el = document.getElementById("product");
if (!p) { el.innerHTML = `<h1>Item not found</h1><p><a href="index.html">← Back to shop</a></p>`; renderChrome(s, "shop"); }
else {
  document.title = p.name; renderChrome(s, "shop");
  const photos = [p.image_url, ...(p.images || [])].filter(safeUrl);
  const opts = (p.options || []).filter((o) => o.values?.length);
  const locked = isLocked(p);
  const soldOut = p.stock === 0 || locked;
  el.innerHTML = `<p><a href="index.html#shop">← Back to shop</a></p>
  <div class="pdp">
    <div class="pdp-photos">
      ${photos.length ? `<img id="main-img" class="pdp-main" src="${esc(photos[0])}" alt="${esc(p.name)}">` : `<div class="pdp-main ph"></div>`}
      ${photos.length > 1 ? `<div class="thumbs">${photos.map((u, i) => `<button class="${i ? "" : "active"}" data-src="${esc(u)}"><img src="${esc(u)}" alt=""></button>`).join("")}</div>` : ""}
    </div>
    <div class="pdp-info card">
      ${p.preorder ? `<span class="tag">🧸 PRE-ORDER</span>` : ""} ${p.featured ? `<span class="tag">★ Best seller</span>` : ""} ${p.categories ? `<span class="tag">${esc(p.categories.name)}</span>` : ""}
      <h1 style="margin-top:10px">${esc(p.name)}</h1>
      <div class="price big" id="price">${money(p.price_cents)}</div>
      ${opts.map((o, i) => `<label>${esc(o.name)}</label><div class="opt-group" data-opt="${i}">
        ${o.values.map((v) => `<button type="button" class="opt" data-label="${esc(v.label)}">${esc(v.label)}${v.price_delta_cents ? ` <small>(${v.price_delta_cents > 0 ? "+" : "−"}${money(Math.abs(v.price_delta_cents))})</small>` : ""}</button>`).join("")}</div>`).join("")}
      ${locked ? `<div class="drop-box"><b>🔒 Drops ${esc(dropLabel(p.drop_at))}</b><div class="countdown big" data-countdown="${esc(p.drop_at)}"></div></div>`
        : p.digital ? `<div class="digital-box">📄 <b>Digital file (PDF)</b> — not a physical item. Your download unlocks on your order page once your payment is confirmed.</div>`
        : p.preorder ? `<div class="preorder-box">🧸 <b>Pre-order</b>${p.ships_by ? ` — ready ${esc(p.ships_by)}` : ""}. I'll make yours after you order${p.stock ? ` · only ${p.stock} spots left` : ""}.</div>`
        : `<div class="stock" style="margin:14px 0 6px">${p.stock === null ? "Made to order" : soldOut ? "Sold out" : `${p.stock} available`}</div>`}
      ${p.digital || soldOut ? `<input id="qty" type="hidden" value="1">` : `<label style="margin-top:6px">Quantity</label>
      <div class="qty-step"><button type="button" data-step="-1" aria-label="Less">−</button><input id="qty" type="number" min="1" max="${p.stock ?? 100}" value="1" aria-label="Quantity"><button type="button" data-step="1" aria-label="More">+</button></div>`}
      <div class="buy-row">
        <button class="btn secondary" id="add" ${soldOut ? "disabled" : ""}>${locked ? "Coming soon" : soldOut ? "Sold out" : p.preorder ? "Add pre-order to cart" : "Add to cart"}</button>
        ${soldOut ? "" : `<button class="btn buy-now" id="buy-now">Buy it now</button>`}
      </div>
      <p style="margin:10px 0 0"><button class="btn secondary small" id="share" type="button">🔗 Share</button></p>
      <p class="error" id="err"></p>
      ${s.order_note ? `<p class="order-note">⏳ ${esc(s.order_note)}</p>` : ""}
      ${p.digital || s.custom_open === false ? "" : `<a class="bigger-link" href="custom.html?item=${encodeURIComponent(p.name)}">📏 Want it bigger or in different colors? Request a custom version →</a>`}
      <div class="desc-full">${md(p.description)}</div>
    </div>
  </div>`;
  startCountdowns(el);
  document.getElementById("share").onclick = async () => {
    // Share the preview page (shows a photo + price in Messenger, Facebook, iMessage…)
    const url = (s.site_url || location.href.replace(/[^/]*$/, "")).replace(/\/?$/, "/") + "p/" + p.id + ".html";
    if (navigator.share) { try { await navigator.share({ title: p.name, url }); } catch {} }
    else { await navigator.clipboard.writeText(url); toast("Link copied!"); }
  };
  const chosen = {};
  const update = () => {
    let price = p.price_cents;
    opts.forEach((o) => { const v = o.values.find((x) => x.label === chosen[o.name]); if (v) price += Number(v.price_delta_cents) || 0; });
    document.getElementById("price").textContent = money(price);
  };
  el.querySelectorAll(".opt-group").forEach((g) => g.addEventListener("click", (e) => {
    const b = e.target.closest(".opt"); if (!b) return;
    g.querySelectorAll(".opt").forEach((x) => x.classList.toggle("active", x === b));
    chosen[opts[g.dataset.opt].name] = b.dataset.label; update();
    document.getElementById("err").textContent = "";
  }));
  el.querySelector(".thumbs")?.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.getElementById("main-img").src = b.dataset.src;
    el.querySelectorAll(".thumbs button").forEach((x) => x.classList.toggle("active", x === b));
  });
  el.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => {
    const q = document.getElementById("qty"), max = Number(q.max) || 100;
    q.value = Math.min(max, Math.max(1, (parseInt(q.value) || 1) + Number(b.dataset.step)));
  });
  const addToCart = () => {
    const missing = opts.find((o) => !chosen[o.name]);
    if (missing) { document.getElementById("err").textContent = `Please choose a ${missing.name.toLowerCase()}.`; return false; }
    const qty = Math.max(1, parseInt(document.getElementById("qty").value) || 1);
    if (p.stock !== null && !p.digital && cart.countOf(p.id) + qty > p.stock) { toast(`Only ${p.stock} available`); return false; }
    cart.add(p, qty, { ...chosen });
    return true;
  };
  document.getElementById("add").onclick = () => { if (addToCart()) toast(`Added ${p.name} to cart`); };
  const buy = document.getElementById("buy-now");
  if (buy) buy.onclick = () => { if (addToCart()) location.href = "cart.html"; };
}
</script>
<footer id="site-footer"></footer>
</body>
</html>
