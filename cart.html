<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart</title>
<link rel="icon" href="assets/icon/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon/apple-touch.png">
<link rel="stylesheet" href="assets/style.css?v=20261127063316">
</head>
<body>
<header id="site-header"></header>
<main class="container">
  <div id="checkout-view">
    <h1>Your cart</h1>
    <div class="layout-2">
      <div><div id="items"></div><div class="summary card" id="summary" style="margin-top:18px"></div></div>
      <form id="form" class="card">
        <h2>Checkout</h2>
        <label>How would you like to get your order?</label>
        <div id="fulfill-options"></div>
        <p class="muted" id="pickup-info" style="margin:6px 0 0"></p>

        <label>Your name *</label><input name="name" required maxlength="200" autocomplete="name">
        <label>Email *</label><input name="email" type="email" required maxlength="200" autocomplete="email">
        <label>Phone</label><input name="phone" type="tel" maxlength="50" autocomplete="tel">

        <div id="address-box" hidden>
          <label>Street address *</label><input name="line1" maxlength="200" autocomplete="address-line1">
          <label>Apt, suite, etc.</label><input name="line2" maxlength="200" autocomplete="address-line2">
          <div class="row3">
            <div><label>City *</label><input name="city" maxlength="100" autocomplete="address-level2"></div>
            <div><label>State *</label><input name="state" maxlength="30" autocomplete="address-level1" placeholder="NY"></div>
            <div><label>ZIP *</label><input name="zip" maxlength="20" autocomplete="postal-code" inputmode="numeric"></div>
          </div>
        </div>

        <label id="pay-label">How will you pay?</label>
        <div id="pay-options"></div>

        <label>Discount code</label>
        <div class="inline" style="margin-top:0"><div><input id="code" placeholder="e.g. WELCOME10" autocapitalize="characters" maxlength="30"></div><button type="button" class="btn small secondary" id="apply-code">Apply</button></div>
        <p class="muted" id="code-msg" style="margin:4px 0 0"></p>

        <label>Notes</label><textarea name="notes" maxlength="2000" placeholder="Pickup time preferences, gift notes, etc."></textarea>
        <p class="order-note" id="order-note" style="display:none"></p>
        <label class="agree" id="agree-box" hidden><input type="checkbox" id="agree"><span id="agree-text"></span></label>
        <p class="error" id="err"></p>
        <button class="btn" id="submit" style="width:100%">Place order</button>
      </form>
    </div>
  </div>
  <div id="done-view" class="article" style="display:none"></div>
</main>
<script type="module">
import { sb, getSettings, renderChrome, esc, money, safeUrl, cart } from "./assets/common.js?v=20261127063316";
const s = await getSettings();
renderChrome(s, "cart");
const $ = (id) => document.getElementById(id);
const depositPct = Number(s.deposit_percent) || 0;
if (s.order_note) { $("order-note").textContent = "⏳ " + s.order_note; $("order-note").style.display = ""; }

// ----- Pickup or shipping -----
const shipFee = (sub) => (s.free_shipping_over_cents != null && sub >= s.free_shipping_over_cents) ? 0 : (s.shipping_flat_cents || 0);
const fOpts = [];
if (s.allow_pickup !== false) fOpts.push(["pickup", "📍 Local pickup", "Free"]);
if (s.allow_shipping) fOpts.push(["shipping", "📦 Shipping", s.free_shipping_over_cents != null ? `${money(s.shipping_flat_cents)} · free over ${money(s.free_shipping_over_cents)}` : money(s.shipping_flat_cents)]);
$("fulfill-options").innerHTML = fOpts.map(([v, l, d], i) => `<label class="pay-option"><input type="radio" name="fulfill" value="${v}" ${i === 0 ? "checked" : ""} required><span><b>${l}</b><br><span class="muted">${d}</span></span></label>`).join("");
const allDigital = () => { const c = cart.get(); return c.length > 0 && c.every((i) => i.digital); };
const fulfill = () => allDigital() ? "digital" : (document.querySelector("[name=fulfill]:checked")?.value || "pickup");

// ----- Payment options -----
function paintPay() {
  const opts = [];
  if (s.zelle_handle) opts.push(["zelle", "Zelle", `To <b>${esc(s.zelle_handle)}</b> · no fees`]);
  if (s.venmo_handle) opts.push(["venmo", "Venmo", `To <b>@${esc(s.venmo_handle.replace(/^@/, ""))}</b>`]);
  if (s.paypal_email) opts.push(["paypal", "PayPal", `To <b>${esc(s.paypal_email)}</b>`]);
  if (!depositPct && s.allow_pay_at_pickup && fulfill() === "pickup") opts.push(["pickup", "Pay at pickup", "Cash or app when you pick up"]);
  const cur = document.querySelector("[name=pay]:checked")?.value;
  $("pay-options").innerHTML = opts.length
    ? opts.map(([v, l, d], i) => `<label class="pay-option"><input type="radio" name="pay" value="${v}" ${(cur ? cur === v : i === 0) ? "checked" : ""} required><span><b>${l}</b><br><span class="muted">${d}</span></span></label>`).join("")
    : `<p class="error">Payment options haven't been set up yet.</p>`;
  if (!document.querySelector("[name=pay]:checked")) document.querySelector("[name=pay]")?.click();
  $("pay-label").textContent = allDigital() ? "How will you pay?" : depositPct ? `How will you pay your ${depositPct === 100 ? "payment" : depositPct + "% deposit"}?` : "How will you pay?";
}
function onFulfill() {
  const dig = allDigital();
  $("fulfill-options").hidden = dig; $("fulfill-options").previousElementSibling.hidden = dig;
  const ship = fulfill() === "shipping";
  $("address-box").hidden = !ship;
  ["line1", "city", "state", "zip"].forEach((n) => (document.querySelector(`[name=${n}]`).required = ship));
  $("pickup-info").textContent = dig ? "📩 Digital download, so nothing to pick up or ship. Your PDF unlocks on your order page as soon as your payment is confirmed." : ship ? "" : (s.pickup_location || "");
  paintPay(); render();
}
$("fulfill-options").addEventListener("change", onFulfill);

// ----- Deposit agreement -----
if (depositPct > 0) {
  $("agree-box").hidden = false;
  $("agree").required = true;
}

// ----- Discount -----
let discount = null;
const discountFor = (sub) => !discount || sub < discount.min_subtotal_cents ? 0
  : Math.min(sub, discount.percent_off ? Math.round(sub * discount.percent_off / 100) : discount.amount_off_cents);
$("apply-code").onclick = async () => {
  const code = $("code").value.trim().toUpperCase(), msg = $("code-msg");
  if (!code) { discount = null; msg.textContent = ""; return render(); }
  const { data } = await sb.rpc("check_discount", { p_code: code });
  if (!data) { discount = null; msg.innerHTML = `<span class="error">That code isn't valid.</span>`; return render(); }
  discount = data;
  msg.textContent = `✓ ${data.code}: ${data.percent_off ? data.percent_off + "% off" : money(data.amount_off_cents) + " off"}${data.min_subtotal_cents ? ` orders of ${money(data.min_subtotal_cents)}+` : ""}`;
  render();
};

// ----- Cart + totals -----
const line = (l, v, cls = "") => `<div class="sum-line ${cls}"><span>${l}</span><span>${v}</span></div>`;
function render() {
  const items = cart.get();
  if (!items.length) {
    $("items").innerHTML = `<div class="card center empty-cart"><img src="assets/art/mascot-anim.webp" data-fb="assets/art/apng/mascot-anim.png" alt="" width="150" height="212"><p>Your cart is empty!</p><a class="btn" href="index.html#shop">Go shopping</a></div>`;
    $("summary").style.display = "none"; $("submit").disabled = true; return;
  }
  $("items").innerHTML = items.map((i, idx) => `<div class="cart-item">
    ${safeUrl(i.image_url) ? `<img src="${esc(i.image_url)}" alt="">` : `<div class="ph"></div>`}
    <div><b>${esc(i.name)}</b><br><span class="muted">${money(i.price_cents)} each</span></div>
    ${i.digital ? `<span class="muted" style="font-size:.85rem">📄 PDF</span>` : `<input class="qty" type="number" min="1" max="100" value="${i.quantity}" data-idx="${idx}">`}
    <button class="btn small secondary" data-remove="${idx}" type="button">Remove</button></div>`).join("");
  const sub = items.reduce((t, i) => t + i.price_cents * i.quantity, 0), off = discountFor(sub);
  const ship = fulfill() === "shipping" ? shipFee(sub - off) : 0, total = sub - off + ship;
  const dig = allDigital();
  const dep = dig ? total : Math.ceil(total * depositPct / 100);
  $("summary").style.display = "";
  $("summary").innerHTML = line("Subtotal", money(sub))
    + (off ? line(`Discount (${esc(discount.code)})`, "−" + money(off), "good") : "")
    + (fulfill() === "shipping" ? line("Shipping", ship ? money(ship) : "Free") : "")
    + line("Total", money(total), "big")
    + (!dig && depositPct > 0 && depositPct < 100 ? `<div class="deposit-box">${line(`Due now (${depositPct}% deposit)`, money(dep), "big")}${line(fulfill() === "shipping" ? "Rest, due before shipping" : "Rest, due at pickup", money(total - dep))}</div>` : "")
    + `<p class="muted" style="margin:8px 0 0; font-size:.85rem">No sales tax.</p>`;
  $("agree-box").hidden = !(depositPct > 0 || dig); $("agree").required = depositPct > 0 || dig;
  if (dig) $("agree-text").innerHTML = `I understand this is a <b>digital PDF pattern</b>, not a finished item, and my download unlocks once my <b>${money(total)}</b> payment is confirmed.`;
  else if (depositPct > 0) $("agree-text").innerHTML = depositPct < 100
    ? `I understand my order <b>isn't confirmed or started</b> until my <b>${money(dep)} deposit</b> is received.`
    : `I understand my order <b>isn't confirmed or started</b> until my payment is received.`;
  if (discount && !off && discount.min_subtotal_cents) $("code-msg").textContent = `Add ${money(discount.min_subtotal_cents - sub)} more to use ${discount.code}.`;
}
onFulfill();
$("items").addEventListener("change", (e) => {
  const idx = e.target.dataset.idx; if (idx === undefined) return;
  const items = cart.get(); items[idx].quantity = Math.max(1, Math.min(100, parseInt(e.target.value) || 1)); cart.save(items); render();
});
$("items").addEventListener("click", (e) => {
  const idx = e.target.dataset.remove; if (idx === undefined) return;
  const items = cart.get(); items.splice(idx, 1); cart.save(items); render();
});

// ----- Place order -----
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const btn = $("submit"), err = $("err");
  btn.disabled = true; err.textContent = "";
  const ship = fulfill() === "shipping", hadDigital = cart.get().some((i) => i.digital);
  const { data, error } = await sb.rpc("place_order", {
    p_name: f.get("name"), p_email: f.get("email"), p_phone: f.get("phone"),
    p_payment_method: f.get("pay"), p_notes: f.get("notes"),
    p_items: cart.get().map((i) => ({ product_id: i.product_id, quantity: i.quantity, options: i.options || {} })),
    p_discount_code: discount?.code || null,
    p_fulfillment: fulfill(),
    p_address: ship ? { name: f.get("name"), line1: f.get("line1"), line2: f.get("line2"), city: f.get("city"), state: f.get("state"), zip: f.get("zip") } : null,
  });
  if (error) { err.textContent = error.message; btn.disabled = false; return; }
  cart.clear();
  const n = data.order_number, dueNow = data.deposit_cents || data.total_cents, rest = data.total_cents - dueNow;
  const amt = money(dueNow), what = data.deposit_cents && rest > 0 ? "deposit" : "payment";
  let payMsg = "";
  if (data.payment_method === "zelle") payMsg = `<p>Send your <b>${amt} ${what}</b> by <b>Zelle</b> to <b>${esc(s.zelle_handle)}</b> and put <b>Order #${n}</b> in the memo.</p>`;
  else if (data.payment_method === "venmo") {
    const handle = s.venmo_handle.replace(/^@/, "");
    payMsg = `<p>Send your <b>${amt} ${what}</b> by <b>Venmo</b> to <b>@${esc(handle)}</b> with <b>Order #${n}</b> in the note.</p>
      <p><a class="btn" href="https://venmo.com/${encodeURIComponent(handle)}?txn=pay&amount=${(dueNow / 100).toFixed(2)}&note=${encodeURIComponent("Order #" + n + " " + what)}">Open Venmo</a></p>`;
  } else if (data.payment_method === "paypal") {
    payMsg = `<p>Send your <b>${amt} ${what}</b> by <b>PayPal</b> to <b>${esc(s.paypal_email)}</b> with <b>Order #${n}</b> in the note.</p>
      <p><a class="btn" href="https://www.paypal.com/myaccount/transfer/homepage/pay" target="_blank" rel="noopener">Open PayPal</a></p>`;
  } else payMsg = `<p>You'll pay <b>${money(data.total_cents)}</b> when you pick up.</p>`;
  const qr = safeUrl(s[data.payment_method + "_qr_url"]);
  if (qr) payMsg += `<div class="pay-qr"><img src="${esc(qr)}" alt="${esc(data.payment_method)} QR code"><p class="muted">Scan with your phone's camera or ${data.payment_method === "zelle" ? "your bank app" : "the app"} to pay</p></div>`;
  $("checkout-view").style.display = "none";
  const done = $("done-view");
  done.style.display = "";
  done.innerHTML = `<img class="thanks-mascot" src="assets/art/girl-thanks-anim.webp" data-fb="assets/art/apng/girl-thanks-anim.png" alt="" width="180" height="230"><h1>Thank you! 🧶</h1><div class="notice"><h2>Order #${n} is reserved</h2>
    ${data.deposit_cents ? `<p class="deposit-alert">⚠️ ${data.fulfillment === "digital" ? "Your download unlocks once your payment is received." : `Your order isn't confirmed until your ${what} is received.`} Please send it within <b>48 hours</b>.</p>` : ""}
    ${payMsg}
    ${rest > 0 && data.deposit_cents ? `<p>The remaining <b>${money(rest)}</b> is due ${data.fulfillment === "shipping" ? "before your order ships" : "at pickup"}.</p>` : ""}
    ${hadDigital ? `<p class="digital-box">📄 <b>Your pattern download</b> will appear on your <a href="order.html?n=${n}">order page</a> as soon as I confirm your payment. Bookmark it!</p>` : ""}
    ${data.fulfillment === "digital" ? "" : data.fulfillment === "shipping" ? `<p><b>Shipping:</b> I'll email you tracking when it ships.</p>`
      : `<p><b>Pickup:</b> ${esc(s.pickup_location)}</p>${s.pickup_instructions ? `<p style="white-space:pre-wrap">${esc(s.pickup_instructions)}</p>` : ""}`}
    ${data.discount_cents ? `<p>You saved ${money(data.discount_cents)}! 🎉</p>` : ""}
    <p class="muted">Save your order number. <a href="order.html?n=${n}">Check your order status</a> anytime.</p></div>`;
});
</script>
<footer id="site-footer"></footer>
</body>
</html>
