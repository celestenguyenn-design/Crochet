<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
<style>
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .tabs button { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; color: var(--text); }
  .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .list > .card { margin-bottom: 14px; }
  .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .pill { font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--line); }
  .pill.paid { background: #c8ecd0; color: #1d6b31; } .pill.unpaid { background: #fde2c8; color: #8a4b10; }
  .inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 10px; }
  .inline > div { flex: 1; min-width: 150px; }
  .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters select { width: auto; }
  .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stats .card b { font-size: 1.5rem; display: block; }
  .preview-swatch { display: flex; gap: 8px; margin-top: 12px; }
  .preview-swatch span { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--line); }
  .extra-photos { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .extra-photos div { position: relative; } .extra-photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; }
  .extra-photos button { position: absolute; top: -6px; right: -6px; padding: 0 7px; box-shadow: none; }
  .opt-edit { margin-bottom: 10px; box-shadow: none; border: 1px solid var(--line); padding: 12px; }
  .faq-edit hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  details > summary { cursor: pointer; }
  /* Homepage builder */
  .hp { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .hp { grid-template-columns: 1fr; } }
  .hp-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; position: sticky; top: 76px; z-index: 5; }
  .hp-side > .card { margin-bottom: 12px; }
  .hp-item { padding: 10px 12px; margin-bottom: 10px; }
  .hp-item.off { opacity: .55; }
  .hp-item.open { outline: 2px solid var(--primary); }
  .hp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hp-name { display: flex; gap: 10px; align-items: center; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; flex: 1; padding: 4px 0; }
  .hp-icon { font-size: 1.4rem; }
  .hp-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .hp-actions button { background: none; border: 0; font-size: 1.05rem; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--text); }
  .hp-actions button:hover:not(:disabled) { background: var(--line); }
  .hp-actions button:disabled { opacity: .25; cursor: default; }
  .hp-fields { border-top: 1px solid var(--line); margin-top: 8px; }
  .hp-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .hp-picker button { text-align: left; cursor: pointer; font: inherit; color: inherit; font-size: .9rem; padding: 12px; }
  .hp-picker .hp-icon { display: block; margin-bottom: 4px; }
  .hp-preview { position: sticky; top: 76px; }
  .hp-preview-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; }
  .hp-frame-wrap { background: var(--line); border-radius: var(--radius); padding: 10px; display: flex; justify-content: center; }
  #hp-frame { width: 100%; height: 78vh; border: 0; border-radius: calc(var(--radius) - 6px); background: #fff; transition: width .3s; }
  @media (max-width: 960px) { .hp-preview { position: static; } #hp-frame { height: 70vh; } }
  .req-photos { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
  .req-photos img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; }
  .order-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .paybadge { display: inline-block; font-weight: 800; letter-spacing: .5px; padding: 6px 14px; border-radius: 999px; margin: 10px 0 4px; font-size: .9rem; }
  .paybadge.green { background: #c8ecd0; color: #1d6b31; } .paybadge.yellow { background: #fff0c2; color: #7a5600; }
  .paybadge.red { background: #fde0e0; color: #a32020; } .paybadge.grey { background: var(--line); }
  .order-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
  @media (max-width: 760px) { .order-grid { grid-template-columns: 1fr; gap: 6px; } }
  .order h4 { margin: 14px 0 6px; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .order .sum-line { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .order .sum-line.big { font-weight: 800; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
  .order .sum-line.good span:last-child { color: #2e8b57; font-weight: 700; } .order .sum-line.owe span:last-child { color: #a32020; font-weight: 800; }
  .order-items .sum-line { border-bottom: 1px dashed var(--line); }
  .addr { white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-family: inherit; }
  .cust-note { background: var(--bg); border-radius: 12px; padding: 8px 12px; }
  .order.cancelled { opacity: .55; }
  .quick { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .order-edit { margin-top: 12px; } .order-edit summary { font-weight: 700; color: var(--primary); }
  .btn.pirate { background: #1e4f86; box-shadow: none; }
  .pre-table { width: 100%; }
  .tchart { display: flex; align-items: flex-end; gap: 2px; height: 160px; padding-top: 10px; }
  .tcol { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .tcol span { width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
  .tcol:hover span { opacity: 1; }
  .tchart-axis { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .tbar { display: grid; grid-template-columns: minmax(120px, 1.2fr) 2fr auto auto; gap: 10px; align-items: center; padding: 5px 0; }
  .tbar .tl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbar .tt { background: var(--line); border-radius: 999px; height: 10px; overflow: hidden; }
  .tbar .tt span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
  .gal-admin { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .gal-admin img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
  dialog { border: 0; border-radius: var(--radius); padding: 0; width: min(760px, 95vw); background: var(--bg); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { padding: 24px; }
</style>
</head>
<body>
<header id="site-header"><div class="container header-inner"><span class="logo-text">Shop Admin</span><nav><a href="index.html" target="_blank">View site ↗</a><a href="#" id="logout" style="display:none">Log out</a></nav></div></header>
<main class="container">
  <form id="login" class="card article" style="max-width:420px; display:none">
    <h2>Admin log in</h2>
    <label>Email</label><input name="email" type="email" required>
    <label>Password</label><input name="password" type="password" required>
    <p class="error" id="login-err"></p>
    <button class="btn">Log in</button>
  </form>
  <div id="app" style="display:none">
    <div class="tabs" id="tabs">
      <button data-tab="orders" class="active">Orders</button>
      <button data-tab="preorders">Pre-orders</button>
      <button data-tab="requests">Custom Requests</button>
      <button data-tab="messages">Messages</button>
      <button data-tab="products">Products</button>
      <button data-tab="homepage">Homepage</button>
      <button data-tab="gallery">Gallery</button>
      <button data-tab="patterns">Patterns</button>
      <button data-tab="reviews">Reviews &amp; FAQ</button>
      <button data-tab="pages">Pages</button>
      <button data-tab="marketing">Marketing</button>
      <button data-tab="markets">Markets</button>
      <button data-tab="traffic">📈 Traffic</button>
      <button data-tab="appearance">Appearance</button>
      <button data-tab="settings">Payment &amp; Pickup</button>
    </div>
    <section id="tab-orders"></section>
    <section id="tab-preorders" hidden></section>
    <section id="tab-requests" hidden></section>
    <section id="tab-messages" hidden></section>
    <section id="tab-products" hidden></section>
    <section id="tab-homepage" hidden></section>
    <section id="tab-gallery" hidden></section>
    <section id="tab-reviews" hidden></section>
    <section id="tab-pages" hidden></section>
    <section id="tab-marketing" hidden></section>
    <section id="tab-markets" hidden></section>
    <section id="tab-traffic" hidden></section>
    <section id="tab-patterns" hidden></section>
    <section id="tab-appearance" hidden></section>
    <section id="tab-settings" hidden></section>
  </div>
</main>
<dialog id="dlg"></dialog>

<script type="module">
import { sb, getSettings, applyTheme, esc, money, safeUrl, toast, FONTS } from "./assets/common.js";
import { SECTION_TYPES, newSection } from "./assets/sections.js";

let settings = await getSettings();
const $ = (id) => document.getElementById(id);
const toCents = (v) => Math.round(parseFloat(v || 0) * 100);
const fmtDate = (d) => new Date(d).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

// ---------- Auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").style.display = ""; $("app").style.display = "none"; $("logout").style.display = "none"; return; }
  const { data: isAdmin } = await sb.rpc("is_admin");
  if (!isAdmin) {
    $("login").style.display = ""; $("login-err").textContent = "This account isn't an admin yet.";
    await sb.auth.signOut(); return;
  }
  $("login").style.display = "none"; $("app").style.display = ""; $("logout").style.display = "";
  localStorage.setItem("is_owner", "1");
  showTab("orders");
}
$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
  if (error) $("login-err").textContent = error.message; else boot();
});
$("logout").addEventListener("click", async (e) => { e.preventDefault(); await sb.auth.signOut(); boot(); });

// ---------- Tabs ----------
const loaders = { orders: loadOrders, requests: loadRequests, preorders: loadPreorders, messages: loadMessages, products: loadProducts, homepage: loadHomepage, gallery: loadGallery, reviews: loadReviews, pages: loadPages, marketing: loadMarketing, markets: loadMarkets, traffic: loadTraffic, patterns: loadPatterns, appearance: loadAppearance, settings: loadSettings };
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll("#app > section").forEach((s) => (s.hidden = s.id !== "tab-" + name));
  loaders[name]();
}
$("tabs").addEventListener("click", (e) => e.target.dataset.tab && showTab(e.target.dataset.tab));

// ---------- Image upload ----------
async function uploadImage(file) {
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from("images").upload(path, file, { contentType: file.type });
  if (error) { toast("Upload failed: " + error.message); return null; }
  return sb.storage.from("images").getPublicUrl(path).data.publicUrl;
}
// Wire up: <input type=file data-target="fieldName"> fills the text input with that name.
function wireUploads(root) {
  root.querySelectorAll("input[type=file][data-target]").forEach((inp) => inp.addEventListener("change", async () => {
    if (!inp.files[0]) return;
    toast("Uploading…");
    const url = await uploadImage(inp.files[0]);
    if (url) { root.querySelector(`[name="${inp.dataset.target}"]`).value = url; toast("Uploaded!"); }
  }));
}
const imgField = (name, label, value) => `<label>${label}</label>
  <input name="${name}" value="${esc(value)}" placeholder="Upload a photo or paste an image link">
  <input type="file" accept="image/*" data-target="${name}" style="margin-top:6px">`;

// ---------- Orders ----------
const ORDER_STATUSES = ["new", "in_progress", "ready", "shipped", "picked_up", "cancelled"];
const STATUS_LABEL = { new: "New", in_progress: "Being made", ready: "Ready", shipped: "Shipped", picked_up: "Picked up", cancelled: "Cancelled" };
const PAY_LABEL = { unpaid: "Nothing paid yet", deposit_paid: "Deposit paid", paid: "Paid in full", refunded: "Refunded" };
const label = (s) => s.replace("_", " ").replace(/^\w/, (c) => c.toUpperCase());
const isDone = (o) => ["picked_up", "shipped", "cancelled"].includes(o.status);
const owedOf = (o) => Math.max(0, o.total_cents - (o.amount_paid_cents || 0));
const addrText = (a) => a ? [a.name, a.line1, a.line2, `${a.city}, ${a.state} ${a.zip}`].filter(Boolean).join("\n") : "";
let orderFilter = "open";
async function loadOrders() {
  const el = $("tab-orders");
  const { data: orders, error } = await sb.from("orders").select("*, order_items(*)").order("created_at", { ascending: false }).limit(500);
  if (error) { el.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
  const live = orders.filter((o) => o.status !== "cancelled");
  const FILTERS = {
    open: ["Open orders", (o) => !isDone(o)],
    deposit: ["Waiting for deposit", (o) => o.payment_status === "unpaid" && o.status !== "cancelled"],
    owing: ["Still owes money", (o) => o.status !== "cancelled" && o.payment_status !== "refunded" && owedOf(o) > 0],
    toship: ["To ship", (o) => o.fulfillment === "shipping" && !isDone(o)],
    ...Object.fromEntries(ORDER_STATUSES.map((s) => [s, [STATUS_LABEL[s], (o) => o.status === s]])),
    all: ["All orders", () => true],
  };
  const shown = orders.filter(FILTERS[orderFilter][1]);
  el.innerHTML = `
    <div class="stats">
      <div class="card"><b>${orders.filter(FILTERS.open[1]).length}</b>Open orders</div>
      <div class="card"><b>${orders.filter(FILTERS.deposit[1]).length}</b>Waiting for deposit</div>
      <div class="card"><b>${orders.filter(FILTERS.toship[1]).length}</b>To ship</div>
      <div class="card"><b>${money(live.reduce((t, o) => t + (o.amount_paid_cents || 0), 0))}</b>Received</div>
      <div class="card"><b>${money(live.filter((o) => o.payment_status !== "refunded").reduce((t, o) => t + owedOf(o), 0))}</b>Still owed to you</div>
    </div>
    <div class="filters"><button class="btn small secondary" id="orders-csv">⬇ Download spreadsheet</button><select id="of">${Object.entries(FILTERS).map(([k, [l]]) => `<option value="${k}" ${k === orderFilter ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="list">${shown.length ? shown.map(orderCard).join("") : `<p class="muted">No orders here.</p>`}</div>`;
  $("of").onchange = (e) => { orderFilter = e.target.value; loadOrders(); };
  $("orders-csv").onclick = () => downloadCSV("orders", [
    ["Order #", "Date", "Customer", "Email", "Phone", "Items", "Pickup/Ship", "Ship to", "Subtotal", "Discount", "Code", "Shipping", "Total", "Deposit", "Paid", "Still owed", "Payment method", "Payment status", "Order status", "Tracking", "Notes"],
    ...orders.map((o) => [o.order_number, o.created_at.slice(0, 10), o.customer_name, o.email, o.phone,
      o.order_items.map((i) => `${i.quantity} x ${i.name}`).join("; "), o.fulfillment, addrText(o.ship_address).replace(/\n/g, ", "),
      dollars(o.subtotal_cents), dollars(o.discount_cents), o.discount_code, dollars(o.shipping_cents), dollars(o.total_cents), dollars(o.deposit_cents),
      dollars(o.amount_paid_cents), dollars(owedOf(o)), o.payment_method, PAY_LABEL[o.payment_status], STATUS_LABEL[o.status], o.tracking_number, o.admin_notes])]);
  const save = async (id, patch) => {
    const { error } = await sb.from("orders").update(patch).eq("id", id);
    toast(error ? error.message : "Saved"); if (!error) loadOrders();
  };
  el.querySelectorAll(".order").forEach((card) => {
    const o = orders.find((x) => x.id === card.dataset.id);
    card.querySelector("[data-act=deposit]")?.addEventListener("click", () => save(o.id, { payment_status: "deposit_paid", amount_paid_cents: o.deposit_cents, status: o.status === "new" ? "in_progress" : o.status }));
    card.querySelector("[data-act=full]")?.addEventListener("click", () => save(o.id, { payment_status: "paid", amount_paid_cents: o.total_cents }));
    card.querySelector("[data-act=orderlink]")?.addEventListener("click", async () => {
      await navigator.clipboard.writeText((settings.site_url || location.href.replace(/[^/]*$/, "")).replace(/\/?$/, "/") + "order.html?n=" + o.order_number);
      toast("Copied! They enter their email there to download.");
    });
    card.querySelector("[data-act=copy]")?.addEventListener("click", async () => { await navigator.clipboard.writeText(addrText(o.ship_address)); toast("Address copied — paste it into Pirate Ship"); });
    card.querySelector("[data-act=save]").addEventListener("click", () => {
      const v = (n) => card.querySelector(`[name=${n}]`)?.value;
      save(o.id, { status: v("status"), payment_status: v("payment_status"), amount_paid_cents: toCents(v("amount_paid")),
        admin_notes: v("admin_notes"), ...(card.querySelector("[name=tracking]") ? { tracking_number: v("tracking").trim() } : {}) });
    });
  });
}
function orderCard(o) {
  const pm = { zelle: "Zelle", venmo: "Venmo", paypal: "PayPal", pickup: "Pay at pickup" }[o.payment_method];
  const owed = owedOf(o), paidAmt = o.amount_paid_cents || 0;
  const badge = o.payment_status === "refunded" ? `<div class="paybadge grey">REFUNDED</div>`
    : owed === 0 && o.total_cents > 0 ? `<div class="paybadge green">✓ PAID IN FULL</div>`
    : paidAmt > 0 ? `<div class="paybadge yellow">PARTLY PAID · OWES ${money(owed)}</div>`
    : `<div class="paybadge red">NOTHING PAID · ${o.deposit_cents && o.deposit_cents < o.total_cents ? `${money(o.deposit_cents)} DEPOSIT DUE` : `${money(o.total_cents)} DUE`}</div>`;
  const row = (l, v, cls = "") => `<div class="sum-line ${cls}"><span>${l}</span><span>${v}</span></div>`;
  const ship = o.fulfillment === "shipping";
  return `<div class="card order ${o.status === "cancelled" ? "cancelled" : ""}" data-id="${o.id}">
    <div class="order-top">
      <div><h3 style="margin:0">#${o.order_number} · ${esc(o.customer_name)}</h3>
        <div class="muted" style="font-size:.9rem">${fmtDate(o.created_at)}</div></div>
      <div style="text-align:right"><span class="pill">${o.fulfillment === "digital" ? "📄 Digital" : ship ? "📦 Ship" : "📍 Pickup"}</span> <span class="pill">${STATUS_LABEL[o.status]}</span></div>
    </div>
    ${badge}
    <div class="order-grid">
      <div>
        <h4>Items</h4>
        <div class="order-items">${o.order_items.map((i) => row(`<b>${i.quantity} ×</b> ${esc(i.name)}`, money(i.price_cents * i.quantity))).join("")}</div>
        <h4>Money</h4>
        ${row("Subtotal", money(o.subtotal_cents ?? o.total_cents))}
        ${o.discount_cents ? row(`Discount code <b>${esc(o.discount_code)}</b>`, "−" + money(o.discount_cents), "good") : ""}
        ${ship ? row("Shipping", o.shipping_cents ? money(o.shipping_cents) : "Free") : ""}
        ${row("Total", money(o.total_cents), "big")}
        ${o.deposit_cents && o.deposit_cents < o.total_cents ? row(`Deposit required`, money(o.deposit_cents)) : ""}
        ${row("Paid so far", money(paidAmt))}
        ${row("Still owed", money(owed), owed ? "owe" : "good")}
        <div class="muted" style="font-size:.85rem; margin-top:4px">Paying by ${pm}</div>
      </div>
      <div>
        <h4>Customer</h4>
        <div>${esc(o.customer_name)}</div>
        <div><a href="mailto:${encodeURIComponent(o.email)}?subject=${encodeURIComponent(`Your order #${o.order_number}`)}">${esc(o.email)}</a></div>
        ${o.phone ? `<div><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>` : ""}
        ${o.customer_notes ? `<p class="cust-note">💬 ${esc(o.customer_notes)}</p>` : ""}
        ${ship ? `<h4>Ship to</h4><div class="addr">${esc(addrText(o.ship_address))}</div>
          <div class="inline" style="margin-top:8px"><button class="btn small secondary" data-act="copy">📋 Copy address</button>
          <a class="btn small pirate" href="https://ship.pirateship.com/" target="_blank" rel="noopener">🏴‍☠️ Open Pirate Ship</a></div>
          <label>Tracking number</label><input name="tracking" value="${esc(o.tracking_number)}" placeholder="Paste from Pirate Ship">` : ""}
      </div>
    </div>
    ${o.payment_status !== "paid" && o.status !== "cancelled" ? `<div class="inline quick">
      ${o.payment_status === "unpaid" && o.deposit_cents && o.deposit_cents < o.total_cents ? `<button class="btn small" data-act="deposit">✓ Deposit received (${money(o.deposit_cents)})</button>` : ""}
      <button class="btn small" data-act="full">✓ Paid in full (${money(o.total_cents)})</button></div>` : ""}
    <details class="order-edit"><summary>Update status, payment & notes</summary>
      <div class="inline">
        <div><label>Order status</label><select name="status">${ORDER_STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${STATUS_LABEL[s]}</option>`).join("")}</select></div>
        <div><label>Payment</label><select name="payment_status">${Object.entries(PAY_LABEL).map(([k, l]) => `<option value="${k}" ${k === o.payment_status ? "selected" : ""}>${l}</option>`).join("")}</select></div>

// ---------- Pre-orders (private work queue) ----------
const PRE_STATUS = { waiting: "Waiting", in_progress: "Making it", ready: "Ready", delivered: "Delivered" };
let preShowDone = false;
async function loadPreorders() {
  const el = $("tab-preorders");

  if (error) { el.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
  const list = data.filter((p) => preShowDone || p.status !== "delivered");
  const owedOf = (p) => p.paid_in_full ? 0 : p.total_cents != null ? Math.max(0, p.total_cents - p.paid_cents) : null;
  const badge = (p) => p.paid_in_full ? `<span class="paybadge green">✓ PAID IN FULL</span>`
    : p.paid_cents > 0 ? `<span class="paybadge yellow">PAID ${money(p.paid_cents)}${owedOf(p) != null ? ` · OWES ${money(owedOf(p))}` : ""}</span>`
    : `<span class="paybadge red">NOT PAID</span>`;

      Use ↑ ↓ to change the order.</p><span><button class="btn small secondary" id="pre-csv">⬇ Spreadsheet</button> <button class="btn small" id="new-pre">+ Add pre-order</button></span></div>
    <label style="font-weight:400"><input type="checkbox" id="pre-done" ${preShowDone ? "checked" : ""}>Show delivered</label>
    <div class="stats" style="margin-top:12px">
      <div class="card"><b>${data.filter((p) => p.status !== "delivered").length}</b>To make</div>
      <div class="card"><b>${data.filter((p) => !p.paid_in_full && p.status !== "delivered").length}</b>Not fully paid</div>
      <div class="card"><b>${data.filter((p) => p.needs_shipping && p.status !== "delivered").length}</b>To ship</div>
    </div>
    <div class="list">${list.map((p, i) => `<div class="card order" data-id="${p.id}">
      <div class="order-top"><h3 style="margin:0">${i + 1}. ${esc(p.customer_name)} ${p.source ? `<span class="pill">${esc(p.source)}</span>` : ""}</h3>
        <span class="hp-actions"><button data-up ${i === 0 ? "disabled" : ""}>↑</button><button data-down ${i === list.length - 1 ? "disabled" : ""}>↓</button></span></div>
      ${badge(p)} <span class="pill">${PRE_STATUS[p.status]}</span> ${p.needs_shipping ? `<span class="pill">📦 Ship${p.shipping_paid ? "" : " · shipping not paid"}</span>` : ""}
      <div class="order-grid">
        <div><h4>Making</h4><div style="white-space:pre-wrap; font-weight:600">${esc(p.items)}</div>
          ${p.pattern_notes ? `<h4>Pattern (just for you)</h4><div style="white-space:pre-wrap">${esc(p.pattern_notes)}</div>` : ""}
          ${p.notes ? `<h4>Notes</h4><div style="white-space:pre-wrap">${esc(p.notes)}</div>` : ""}</div>
        <div><h4>Payment</h4><div>${esc(p.payment_note)}</div>
          ${p.contact ? `<h4>Contact</h4><div><a href="${/@/.test(p.contact) ? "mailto:" : "tel:"}${esc(p.contact)}">${esc(p.contact)}</a></div>` : ""}
          ${p.needs_shipping && p.shipping_address ? `<h4>Ship to</h4><div class="addr">${esc(p.customer_name)}\n${esc(p.shipping_address)}</div>
            <div class="inline" style="margin-top:8px"><button class="btn small secondary" data-copy>📋 Copy address</button>
            <a class="btn small pirate" href="https://ship.pirateship.com/" target="_blank" rel="noopener">🏴‍☠️ Pirate Ship</a></div>` : ""}</div>
      </div>
      <div class="inline quick">
        <select data-status style="max-width:180px">${Object.entries(PRE_STATUS).map(([k, l]) => `<option value="${k}" ${k === p.status ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${!p.paid_in_full ? `<button class="btn small" data-paid>✓ Paid in full</button>` : ""}
        <button class="btn small secondary" data-edit>Edit</button></div>
    </div>`).join("") || `<p class="muted">No pre-orders.</p>`}</div>`;
  $("pre-done").onchange = (e) => { preShowDone = e.target.checked; loadPreorders(); };
  $("pre-csv").onclick = () => downloadCSV("pre-orders", [["#", "Customer", "From", "Contact", "Items", "Pattern notes", "Total", "Paid", "Paid in full", "Payment note", "Needs shipping", "Shipping paid", "Address", "Status", "Notes"],
    ...data.map((p, i) => [i + 1, p.customer_name, p.source, p.contact, p.items, p.pattern_notes, dollars(p.total_cents), dollars(p.paid_cents), p.paid_in_full ? "yes" : "no",
      p.payment_note, p.needs_shipping ? "yes" : "no", p.shipping_paid ? "yes" : "no", p.shipping_address, PRE_STATUS[p.status], p.notes])]);
  $("new-pre").onclick = () => preDialog({ position: (data.at(-1)?.position || 0) + 1, paid_cents: 0, status: "waiting" });
  const upd = async (id, patch) => { const { error } = await sb.from("preorders").update(patch).eq("id", id); toast(error ? error.message : "Saved"); loadPreorders(); };
  el.querySelectorAll(".order").forEach((card) => {
    const p = data.find((x) => x.id === card.dataset.id), idx = list.indexOf(p);
    const swap = async (other) => {
      const order = [...data], a = order.indexOf(p), b = order.indexOf(other);
      [order[a], order[b]] = [order[b], order[a]];
      await Promise.all(order.map((x, i) => x.position !== i + 1 ? sb.from("preorders").update({ position: i + 1 }).eq("id", x.id) : null));
      loadPreorders();
    };
    card.querySelector("[data-up]").onclick = () => swap(list[idx - 1]);
    card.querySelector("[data-down]").onclick = () => swap(list[idx + 1]);
    card.querySelector("[data-status]").onchange = (e) => upd(p.id, { status: e.target.value });
    card.querySelector("[data-paid]")?.addEventListener("click", () => upd(p.id, { paid_in_full: true, paid_cents: p.total_cents ?? p.paid_cents, payment_note: "Paid in full", shipping_paid: true }));
    card.querySelector("[data-edit]").onclick = () => preDialog(p);
    card.querySelector("[data-copy]")?.addEventListener("click", async () => { await navigator.clipboard.writeText(`${p.customer_name}\n${p.shipping_address}`); toast("Address copied"); });
  });
}

    <div class="row"><div><label>Customer *</label><input name="customer_name" required value="${esc(p.customer_name)}"></div>

const REQ_STATUSES = ["new", "quoted", "accepted", "in_progress", "done", "declined"];
async function loadRequests() {
  const el = $("tab-requests");
  const { data, error } = await sb.from("custom_requests").select("*").order("created_at", { ascending: false });
  if (error) { el.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
  // Customer photos are private: get temporary links to show them here
  const allPaths = data.flatMap((r) => r.photo_paths || []);
  const signed = {};
  if (allPaths.length) {
    const { data: urls } = await sb.storage.from("request-photos").createSignedUrls(allPaths, 3600);
    (urls || []).forEach((u) => { if (u.signedUrl) signed[u.path] = u.signedUrl; });
  }
  const open = settings.custom_open !== false;
  el.innerHTML = `<form id="custom-switch" class="card" style="margin-bottom:18px; border:2px solid ${open ? "#7ccf8e" : "#f0a0a0"}">
      <div class="head"><h2 style="margin:0">${open ? "🟢 Custom orders are OPEN" : "🔴 Custom orders are CLOSED"}</h2>

      <label>Message shown while closed</label><textarea name="custom_closed_message" style="min-height:70px">${esc(settings.custom_closed_message)}</textarea>
    </form>
    <div class="list">${data.length ? data.map((r) => `<div class="card">
    <div class="head"><h3>${esc(r.name)} ${r.kind ? `<span class="pill">${esc(r.kind)}</span>` : ""}</h3><span class="pill">${label(r.status)}</span></div>
    <div class="muted">${fmtDate(r.created_at)} · ${esc(r.email)} ${r.phone ? "· " + esc(r.phone) : ""}</div>
    <p style="white-space:pre-wrap">${esc(r.description)}</p>
    <p class="muted">${[r.colors && "Colors: " + esc(r.colors), r.size && "Size: " + esc(r.size), r.budget && "Budget: " + esc(r.budget), r.needed_by && "Needed by: " + esc(r.needed_by)].filter(Boolean).join(" · ")}</p>
    ${(r.photo_paths || []).length ? `<div class="req-photos">${r.photo_paths.map((ph) => `<a href="${esc(signed[ph] || "#")}" target="_blank" rel="noopener"><img src="${esc(signed[ph] || "")}" alt="Customer photo"></a>`).join("")}</div>` : ""}
    <div class="inline">
      <div><label>Status</label><select name="status">${REQ_STATUSES.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${label(s)}</option>`).join("")}</select></div>
      <div><label>Quote ($)</label><input name="quote" type="number" step="0.01" min="0" value="${r.quote_cents != null ? (r.quote_cents / 100).toFixed(2) : ""}"></div>
    </div>
    <label>Private notes</label><input name="admin_notes" value="${esc(r.admin_notes)}">
    <div class="inline"><button class="btn small" data-save="${r.id}">Save</button>
      <a class="btn small secondary" href="mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent("Your custom crochet request")}">Email customer</a>
      <button class="btn small danger" data-del="${r.id}">Delete</button></div>
  </div>`).join("") : `<p class="muted">No custom requests yet.</p>`}</div>`;
  $("toggle-custom").onclick = async () => {
    if (open && !confirm("Close custom orders? The request form will be hidden until you reopen.")) return;
    await saveSettings({ custom_open: !open }); loadRequests();
  };
  $("custom-switch").addEventListener("submit", async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); await saveSettings(f); loadRequests();
  });
  el.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const c = b.closest(".card"), q = c.querySelector("[name=quote]").value;
    const { error } = await sb.from("custom_requests").update({ status: c.querySelector("[name=status]").value, quote_cents: q === "" ? null : toCents(q), admin_notes: c.querySelector("[name=admin_notes]").value }).eq("id", b.dataset.save);
    toast(error ? error.message : "Saved"); loadRequests();
  });
  el.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("Delete this request (and its photos)?")) return;
    const req = data.find((r) => r.id === b.dataset.del);
    if (req?.photo_paths?.length) await sb.storage.from("request-photos").remove(req.photo_paths);
    await sb.from("custom_requests").delete().eq("id", b.dataset.del); loadRequests();
  });
}

    if (row.digital) row.stock = null;
    const { error } = p.id ? await sb.from("products").update(row).eq("id", p.id) : await sb.from("products").insert(row);
    toast(error ? error.message : "Saved"); loadProducts();
  };
}

// ---------- Homepage builder (Shopify-style) ----------
let draft = null, dirty = false, openId = null, previewWin = null;
function sendPreview(scrollTo) {
  previewWin?.postMessage({ type: "preview", sections: draft.sections, settings: draft.ann, scrollTo }, location.origin);
}
window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data?.type === "preview-ready" && draft) sendPreview(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
function markDirty(scrollTo) { dirty = true; $("hp-save").disabled = false; $("hp-status").textContent = "Unsaved changes"; sendPreview(scrollTo); }

async function loadHomepage() {
  if (!categories.length) categories = (await sb.from("categories").select("*").order("sort_order")).data || [];
  draft = {
    sections: structuredClone(settings.home_sections?.length ? settings.home_sections : ["hero", "products", "gallery", "shop", "testimonials", "faq"].map(newSection)),

  };
  dirty = false;
  $("tab-homepage").innerHTML = `<div class="hp">
    <div class="hp-side">
      <div class="card hp-bar"><div><b>Homepage editor</b><br><span class="muted" id="hp-status">All changes saved</span></div>

      <button class="btn" id="hp-add" style="width:100%; margin-top:8px">+ Add section</button>
      <div id="hp-picker" class="hp-picker" hidden></div>
    </div>
    <div class="hp-preview"><div class="hp-preview-bar"><span>Live preview</span>
      <span><button class="btn small secondary" data-w="390">📱</button> <button class="btn small secondary" data-w="100%">🖥️</button></span></div>
      <div class="hp-frame-wrap"><iframe id="hp-frame" src="index.html?preview=1" title="Preview"></iframe></div></div>

  ["ann-on", "ann-text", "ann-link"].forEach((id) => $(id).addEventListener("input", annSync));
  $("hp-save").onclick = async () => {
    await saveSettings({ home_sections: draft.sections, ...draft.ann });

  };
  $("hp-discard").onclick = () => { if (!dirty || confirm("Throw away your unsaved changes?")) loadHomepage(); };
  $("hp-add").onclick = () => {
    const pk = $("hp-picker"); pk.hidden = !pk.hidden;
    pk.innerHTML = Object.entries(SECTION_TYPES).map(([k, t]) => `<button class="card" data-type="${k}"><span class="hp-icon">${t.icon}</span><b>${t.label}</b><br><span class="muted">${t.desc}</span></button>`).join("");
    pk.querySelectorAll("[data-type]").forEach((b) => b.onclick = () => {
      const sec = newSection(b.dataset.type); draft.sections.push(sec); openId = sec.id; pk.hidden = true; paintList(); markDirty(sec.id);
    });
  };
  paintList();
}
function paintList() {
  const list = $("hp-list");
  list.innerHTML = draft.sections.map((sec, i) => {
    const t = SECTION_TYPES[sec.type]; if (!t) return "";
    const open = sec.id === openId;
    return `<div class="card hp-item ${sec.enabled ? "" : "off"} ${open ? "open" : ""}" data-i="${i}">
      <div class="hp-row"><button class="hp-name" data-act="toggle-open"><span class="hp-icon">${t.icon}</span><span><b>${t.label}</b>${sec.settings.title ? `<br><span class="muted">${esc(sec.settings.title)}</span>` : ""}</span></button>
        <span class="hp-actions"><button title="Move up" data-act="up" ${i === 0 ? "disabled" : ""}>↑</button><button title="Move down" data-act="down" ${i === draft.sections.length - 1 ? "disabled" : ""}>↓</button>
        <button title="${sec.enabled ? "Hide" : "Show"}" data-act="vis">${sec.enabled ? "👁" : "🚫"}</button><button title="Delete" data-act="del">🗑</button></span></div>
      ${open ? `<div class="hp-fields">${t.fields.map((f) => fieldHtml(f, sec.settings[f.key] ?? f.default)).join("") || `<p class="muted">Nothing to set up — it's just a cute divider!</p>`}</div>` : ""}
    </div>`;
  }).join("");
  list.querySelectorAll(".hp-item").forEach((item) => {
    const i = +item.dataset.i, sec = draft.sections[i];
    item.querySelector(".hp-row").addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")?.dataset.act; if (!act) return;
      if (act === "toggle-open") { openId = openId === sec.id ? null : sec.id; paintList(); return sendPreview(sec.id); }
      if (act === "up" || act === "down") { const j = act === "up" ? i - 1 : i + 1; [draft.sections[i], draft.sections[j]] = [draft.sections[j], draft.sections[i]]; }
      if (act === "vis") sec.enabled = !sec.enabled;
      if (act === "del") { if (!confirm(`Remove the "${SECTION_TYPES[sec.type].label}" section?`)) return; draft.sections.splice(i, 1); }
      paintList(); markDirty(act === "del" ? null : sec.id);
    });
    const fields = item.querySelector(".hp-fields"); if (!fields) return;
    fields.addEventListener("input", (e) => {
      const k = e.target.dataset.key; if (!k) return;
      sec.settings[k] = e.target.type === "number" ? Number(e.target.value) : e.target.value;
      markDirty();
    });
    fields.querySelectorAll("input[type=file][data-key-img]").forEach((inp) => inp.onchange = async () => {
      if (!inp.files[0]) return; toast("Uploading…");
      const url = await uploadImage(inp.files[0]);
      if (url) { sec.settings[inp.dataset.keyImg] = url; fields.querySelector(`[data-key="${inp.dataset.keyImg}"]`).value = url; toast("Uploaded!"); markDirty(sec.id); }
    });
  });
}
function fieldHtml(f, v) {
  const lab = `<label>${esc(f.label)}</label>`;
  if (f.type === "textarea") return lab + `<textarea data-key="${f.key}">${esc(v)}</textarea>`;
  if (f.type === "number") return lab + `<input type="number" min="1" max="50" data-key="${f.key}" value="${esc(v)}">`;
  if (f.type === "select") return lab + `<select data-key="${f.key}">${f.options.map(([val, l]) => `<option value="${val}" ${val === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  if (f.type === "category") return lab + `<select data-key="${f.key}"><option value="">— Pick one —</option>${categories.map((c) => `<option value="${c.id}" ${c.id === v ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`;
  if (f.type === "video") return lab + `<input data-key="${f.key}" value="${esc(v)}" placeholder="Paste an Instagram reel or TikTok link"><input type="file" accept="video/*" data-key-img="${f.key}" style="margin-top:6px"><p class="muted" style="font-size:.85rem;margin:4px 0 0">Or upload a short video (under 50 MB).</p>`;
  if (f.type === "image") return lab + `<input data-key="${f.key}" value="${esc(v)}" placeholder="Upload or paste an image link"><input type="file" accept="image/*" data-key-img="${f.key}" style="margin-top:6px">`;
  return lab + `<input data-key="${f.key}" value="${esc(v)}">`;
}

// ---------- Spreadsheet downloads ----------
function downloadCSV(name, rows) {
  const cell = (v) => { const t = v == null ? "" : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = rows.map((r) => r.map(cell).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `${name}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
const dollars = (c) => c == null ? "" : (c / 100).toFixed(2);

// ---------- Markets & events ----------
async function loadMarkets() {
  const el = $("tab-markets");
  const { data, error } = await sb.from("events").select("*").order("starts_on", { ascending: false });
  if (error) { el.innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }

      slug: slugify(f.get("slug") || f.get("title")) || "pattern-" + Date.now(), cover_image_url: f.get("cover_image_url"),
      materials: f.get("materials"), body: f.get("body"), published, updated_at: new Date().toISOString(),
      published_at: published ? (p.published_at || new Date().toISOString()) : p.published_at ?? null };
    const { error } = p.id ? await sb.from("patterns").update(row).eq("id", p.id) : await sb.from("patterns").insert(row);
    toast(error ? (error.code === "23505" ? "That web address is already used — pick another slug" : error.message) : "Saved");
    loadPatterns();
  };
}

// ---------- Appearance ----------
const PRESETS = {
  "Cozy cream": { color_primary: "#e8956b", color_accent: "#ffd8a8", color_background: "#fff5e9", color_text: "#5c4637", color_card: "#fffaf4", font_heading: "Grandstander", font_body: "Maven Pro", corner_radius: 18 },
  "Pastel bubbly": { color_primary: "#e27aa8", color_accent: "#d9c6f5", color_background: "#fff6fa", color_text: "#5b4463", color_card: "#ffffff", font_heading: "Fredoka", font_body: "Quicksand", corner_radius: 24 },
  "Rose (default)": { color_primary: "#c06c84", color_accent: "#f8b195", color_background: "#fff8f3", color_text: "#3d2c34", color_card: "#ffffff" },
  "Sage": { color_primary: "#5f7f5a", color_accent: "#c9d8b6", color_background: "#f7f6ef", color_text: "#2f3a2c", color_card: "#ffffff" },
  "Lavender": { color_primary: "#7b68a6", color_accent: "#d9cdf0", color_background: "#faf8fd", color_text: "#332b45", color_card: "#ffffff" },
  "Ocean": { color_primary: "#2f6f8f", color_accent: "#a8d5e2", color_background: "#f4f9fb", color_text: "#1f3440", color_card: "#ffffff" },
  "Honey": { color_primary: "#b7791f", color_accent: "#f6d98b", color_background: "#fffbf0", color_text: "#3f2e13", color_card: "#ffffff" },
  "Cozy dark": { color_primary: "#e8a0b4", color_accent: "#6b4f5c", color_background: "#1f1a1d", color_text: "#f3e9ee", color_card: "#2a2327" },
};
const COLOR_FIELDS = [["color_primary", "Main color (buttons, links)"], ["color_accent", "Accent color"], ["color_background", "Page background"], ["color_card", "Card background"], ["color_text", "Text color"]];
function loadAppearance() {
  const s = settings, el = $("tab-appearance");
  const fontOpts = (sel) => Object.keys(FONTS).map((f) => `<option ${f === sel ? "selected" : ""}>${f}</option>`).join("");
  el.innerHTML = `<form id="appearance-form" class="card">
    <h2>Look &amp; feel</h2><p class="muted">Changes preview live on this page. Click Save to publish them to your site.</p>
    <label>Quick color themes</label><div class="inline" style="margin-top:0">${Object.keys(PRESETS).map((k) => `<button type="button" class="btn small secondary" data-preset="${k}">${k}</button>`).join("")}</div>
    <div class="row">${COLOR_FIELDS.map(([k, l]) => `<div><label>${l}</label><input type="color" name="${k}" value="${esc(s[k])}"></div>`).join("")}
      <div><label>Corner roundness: <span id="rv">${s.corner_radius}</span>px</label><input type="range" name="corner_radius" min="0" max="40" value="${s.corner_radius}"></div></div>
    <div class="row"><div><label>Heading font</label><select name="font_heading">${fontOpts(s.font_heading)}</select></div>
      <div><label>Body font</label><select name="font_body">${fontOpts(s.font_body)}</select></div></div>
    <label>Header style</label><select name="header_style">
      <option value="centered" ${(s.header_style || "centered") === "centered" ? "selected" : ""}>Big centered logo, menu underneath</option>
      <option value="classic" ${s.header_style === "classic" ? "selected" : ""}>Logo on the left, menu on the right</option></select>
    <h2 style="margin-top:28px">Branding</h2>
    <label>Shop name</label><input name="shop_name" value="${esc(s.shop_name)}">
    ${imgField("logo_url", "Logo (optional — replaces the shop name in the header)", s.logo_url)}
    ${imgField("banner_image", "Banner picture (your illustrated banner — shows full-width at the top of your home page)", (s.home_sections || []).find((x) => x.type === "image_banner")?.settings?.image || "")}
    <p class="muted" style="font-size:.9rem">Wide pictures work best (about 4× wider than tall). Other homepage sections and the About text are in the <b>Homepage</b> tab.</p>
    <div class="row"><div><label>Instagram link</label><input name="instagram_url" value="${esc(s.instagram_url)}" placeholder="https://instagram.com/…"></div>
      <div><label>TikTok link</label><input name="tiktok_url" value="${esc(s.tiktok_url)}" placeholder="https://tiktok.com/@…"></div></div>
    <h2 style="margin-top:28px">Website address</h2>
    <label>Your site's address</label><input name="site_url" value="${esc(s.site_url)}" placeholder="https://hookedbyceleste.com/">
    <p class="muted" style="font-size:.9rem">Used for share links, link previews and Google. Change it to https://hookedbyceleste.com/ once your domain is connected.</p>
    <h2 style="margin-top:28px">Visitor stats</h2>
    <label>GoatCounter code</label><input name="goatcounter_code" value="${esc(s.goatcounter_code)}" placeholder="e.g. hookedbyceleste">
    <p class="muted" style="font-size:.9rem">Free, no cookies. Sign up at goatcounter.com, pick a code (it becomes <i>yourcode</i>.goatcounter.com), and type just the code here. Your stats are then at that address.</p>
    <h2 style="margin-top:28px">Ads</h2>
    <label>Google AdSense publisher ID</label><input name="adsense_client" value="${esc(s.adsense_client)}" placeholder="ca-pub-1234567890123456">
    <p class="muted" style="font-size:.9rem">Once AdSense approves your site, paste your ID here. Ads then appear on your Free Patterns pages automatically. Leave it blank for no ads.</p>
    <div class="inline"><button class="btn">Save appearance</button><button type="button" class="btn secondary" id="reset-preview">Undo unsaved changes</button></div>
  </form>`;
  const form = $("appearance-form");
  wireUploads(form);
  const preview = () => {
    const f = Object.fromEntries(new FormData(form));
    $("rv").textContent = f.corner_radius;
    applyTheme({ ...settings, ...f, corner_radius: parseInt(f.corner_radius) });
  };
  form.addEventListener("input", preview);
  form.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
    Object.entries(PRESETS[b.dataset.preset]).forEach(([k, v]) => { const f = form.querySelector(`[name=${k}]`); if (f) f.value = v; }); preview();
  });
  $("reset-preview").onclick = () => { applyTheme(settings); loadAppearance(); };
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    f.corner_radius = parseInt(f.corner_radius);
    f.adsense_client = f.adsense_client.trim();
    if (f.adsense_client && !/^ca-pub-\d+$/.test(f.adsense_client)) return toast("AdSense ID should look like ca-pub-1234567890");
    // Banner picture lives in the homepage sections: update it, or add it at the top (hiding the text banner)
    const bannerImg = (f.banner_image || "").trim(); delete f.banner_image;
    let secs = structuredClone(settings.home_sections?.length ? settings.home_sections : ["hero", "products", "gallery", "shop", "testimonials", "faq"].map(newSection));
    const ib = secs.find((x) => x.type === "image_banner");
    if (ib) { ib.settings.image = bannerImg; ib.enabled = !!bannerImg; }
    else if (bannerImg) {
      const sec = newSection("image_banner"); sec.settings.image = bannerImg;
      secs.forEach((x) => { if (x.type === "hero") x.enabled = false; });
      secs.unshift(sec);
    }
    f.home_sections = secs;
    f.goatcounter_code = (f.goatcounter_code || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/\.goatcounter\.com.*$/, "");
    if (f.goatcounter_code && !/^[a-z0-9-]+$/.test(f.goatcounter_code)) return toast("GoatCounter code can only have letters, numbers and dashes");
    await saveSettings(f);
  });
}

// ---------- Payment & pickup ----------
function loadSettings() {
  const s = settings;
  $("tab-settings").innerHTML = `<form id="settings-form" class="card">
    <h2>Payment options</h2><p class="muted">Leave a handle blank to hide that option at checkout. Customers see these after they order, along with their order number to put in the memo.</p>
    <div class="row"><div><label>Zelle (email or phone)</label><input name="zelle_handle" value="${esc(s.zelle_handle)}"></div>
      <div><label>Venmo username</label><input name="venmo_handle" value="${esc(s.venmo_handle)}" placeholder="@yourname"></div></div>
    <label>PayPal email</label><input name="paypal_email" type="email" value="${esc(s.paypal_email)}">
    <p class="muted" style="font-size:.9rem; margin-top:14px">QR codes show on the thank-you screen and order-status page for whichever app the customer picked. Leave blank to hide.</p>
    <div class="row">
      <div>${imgField("zelle_qr_url", "Zelle QR code", s.zelle_qr_url)}</div>
      <div>${imgField("venmo_qr_url", "Venmo QR code", s.venmo_qr_url)}</div>
    </div>
    ${imgField("paypal_qr_url", "PayPal QR code (optional)", s.paypal_qr_url)}
    <label>Deposit required (% of the total, paid before you start)</label>
    <input name="deposit_percent" type="number" min="0" max="100" value="${s.deposit_percent ?? 50}">
    <p class="muted" style="font-size:.9rem">50 = half up front, the rest at pickup/before shipping. 100 = pay everything up front. 0 = no deposit (then "Pay at pickup" can be offered).</p>
    <label style="font-weight:400"><input type="checkbox" name="allow_pay_at_pickup" ${s.allow_pay_at_pickup ? "checked" : ""}>Allow "Pay at pickup" (only when no deposit is required)</label>
    <h2 style="margin-top:28px">Shipping</h2>
    <label style="font-weight:400"><input type="checkbox" name="allow_pickup" ${s.allow_pickup !== false ? "checked" : ""}>Offer local pickup</label>
    <label style="font-weight:400"><input type="checkbox" name="allow_shipping" ${s.allow_shipping ? "checked" : ""}>Offer shipping</label>
    <div class="row"><div><label>Shipping price ($)</label><input name="shipping_flat" type="number" step="0.01" min="0" value="${((s.shipping_flat_cents ?? 800) / 100).toFixed(2)}"></div>
      <div><label>Free shipping on orders over ($, optional)</label><input name="free_over" type="number" step="0.01" min="0" value="${s.free_shipping_over_cents != null ? (s.free_shipping_over_cents / 100).toFixed(2) : ""}"></div></div>
    <h2 style="margin-top:28px">Pickup</h2>
    <label>Pickup location (shown at checkout)</label><input name="pickup_location" value="${esc(s.pickup_location)}" placeholder="e.g. Downtown Austin. Exact address sent after ordering.">
    <label>Order note (shown on product pages & checkout)</label><input name="order_note" value="${esc(s.order_note)}" placeholder="e.g. Please allow up to 2 weeks for shipping.">
    <label>Pickup instructions (shown after ordering)</label><textarea name="pickup_instructions">${esc(s.pickup_instructions)}</textarea>
    <button class="btn" style="margin-top:16px">Save</button></form>`;
  wireUploads($("settings-form"));
  $("settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    f.allow_pay_at_pickup = f.allow_pay_at_pickup === "on";
    f.allow_pickup = f.allow_pickup === "on"; f.allow_shipping = f.allow_shipping === "on";
    if (!f.allow_pickup && !f.allow_shipping) return toast("Turn on pickup, shipping, or both");
    f.deposit_percent = Math.max(0, Math.min(100, parseInt(f.deposit_percent) || 0));
    f.shipping_flat_cents = toCents(f.shipping_flat); delete f.shipping_flat;
    f.free_shipping_over_cents = f.free_over === "" ? null : toCents(f.free_over); delete f.free_over;
    await saveSettings(f);
  });
}
async function saveSettings(patch) {
  const { data, error } = await sb.from("settings").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1).select().single();
  if (error) return toast(error.message);
  settings = data; localStorage.setItem("shop_settings", JSON.stringify(data)); applyTheme(data); toast("Saved!");
}

boot();
</script>
</body>
</html>
